<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>记忆翻牌 · 配对记忆训练</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f3ee;--bg2:#fafaf8;--card:#fff;--card2:#f8f7f4;--accent:#b8860b;--accent2:#daa520;--red:#c0392b;--red2:#e74c3c;--pink:#fceae8;--text:#2d2d2d;--sub:#9a9a9a;--success:#27ae60;--error:var(--red2);--radius:16px;--shadow:0 4px 24px rgba(0,0,0,.05)}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center}
#app{width:100%;max-width:420px;min-height:100vh;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--bg2)}
.bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-deco .orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.07}
.bg-deco .orb:nth-child(1){width:260px;height:260px;background:var(--red);top:-100px;right:-60px}
.bg-deco .orb:nth-child(2){width:200px;height:200px;background:var(--accent);bottom:-60px;left:-60px}
.bg-deco .orb:nth-child(3){width:160px;height:160px;background:var(--red2);top:45%;left:30%}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 4px;z-index:10;position:relative}
header .back-btn{background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer;padding:4px}
header .back-btn:active{transform:scale(.85)}.header-title{font-size:16px;font-weight:700;color:var(--accent)}.header-right{font-size:12px;color:var(--sub)}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all .12s;text-align:center}
.btn:active{transform:scale(.97)}.btn-red{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;box-shadow:0 4px 16px rgba(192,57,43,.25)}.btn-outline{background:transparent;border:2px solid #e0ddd5;color:var(--text)}
.home-screen{text-align:center;padding:30px 18px;flex:1;display:flex;flex-direction:column;justify-content:center;z-index:10}
.home-screen .logo{font-size:52px;margin-bottom:2px}.home-screen h1{font-size:34px;font-weight:900;color:var(--red);margin-bottom:2px}.home-screen .subtitle{color:var(--sub);font-size:13px;margin-bottom:6px}
.home-tagline{color:var(--accent2);font-size:13px;font-weight:600;margin-bottom:16px;letter-spacing:2px}
.home-feats{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;text-align:left}
.home-feats .feat{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--card);padding:10px 14px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.02);border:1px solid #f0ede8}
.map-screen{flex:1;display:flex;flex-direction:column;padding:10px 18px 20px;overflow-y:auto;z-index:10}
.map-screen h2{text-align:center;font-size:20px;font-weight:800;color:var(--red);margin-bottom:12px}
.map-path{flex:1;display:flex;flex-direction:column;gap:8px}
.map-node{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid #f0ede8;border-radius:12px;padding:12px 14px;cursor:pointer;transition:all .2s}
.map-node:active{transform:scale(.98)}.map-node.locked{opacity:.3;pointer-events:none}.map-node.current{border-color:var(--red);box-shadow:0 0 16px rgba(192,57,43,.08)}.map-node.completed{border-color:rgba(39,174,96,.2)}
.map-node .icon{font-size:26px;min-width:34px;text-align:center}.map-node .info{flex:1;min-width:0}
.map-node .info .name{font-size:15px;font-weight:700}.map-node .info .desc{font-size:11px;color:var(--sub);margin-top:1px}.map-node .status{font-size:12px;color:var(--accent)}
.map-connector{text-align:center;font-size:9px;color:#d0d0d0;margin:-3px 0}
.map-progress{text-align:center;font-size:12px;color:var(--sub);margin-bottom:8px}.map-progress span{color:var(--red);font-weight:700}
.game-screen{flex:1;display:flex;flex-direction:column;padding:6px 12px 16px;z-index:10}
.game-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.game-hd .lvl-name{font-size:13px;color:var(--sub)}.game-hd .score{font-size:14px;font-weight:700;color:var(--red)}
.game-stats{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:6px;padding:0 2px}
.game-stats span em{font-style:normal;font-weight:700;color:var(--red)}
.card-grid{display:grid;gap:6px;flex:1;align-content:center;justify-content:center;margin:0 auto;width:100%;max-width:360px}
.card-grid .card{aspect-ratio:1;border-radius:10px;cursor:pointer;transition:all .2s;position:relative;transform-style:preserve-3d;font-size:0;max-height:80px}
.card-grid .card:active{transform:scale(.93)}
.card-grid .card .face{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;font-size:28px;font-weight:700}
.card-grid .card .front{background:linear-gradient(145deg,var(--red2),var(--red));color:#fff;transform:rotateY(0deg);z-index:2;box-shadow:0 2px 8px rgba(192,57,43,.2)}
.card-grid .card .back{background:var(--card);border:2px solid #e8e5e0;color:var(--text);transform:rotateY(180deg);z-index:1}
.card-grid .card.flipped .front{transform:rotateY(180deg);z-index:1}
.card-grid .card.flipped .back{transform:rotateY(360deg);z-index:2}
.card-grid .card.matched{pointer-events:none}
.card-grid .card.matched .back{background:#d4edda;border-color:var(--success);animation:matchPop .35s}
@keyframes matchPop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{translate:0}20%{translate:-4px}40%{translate:4px}60%{translate:-3px}80%{translate:3px}}
.card-grid .card.shake .front{animation:shake .3s}
.result-overlay{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);backdrop-filter:blur(6px);animation:fadeIn .3s ease}
.result-overlay.hidden{display:none}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.result-card{background:var(--card);border-radius:var(--radius);padding:28px 24px;width:90%;max-width:340px;text-align:center;box-shadow:0 12px 48px rgba(0,0,0,.08);border:1px solid #f0ede8;animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}.result-card .big-icon{font-size:52px;margin-bottom:4px}
.result-card .title{font-size:22px;font-weight:800;margin-bottom:2px}.result-card .sub{font-size:13px;color:var(--sub);margin-bottom:10px}.result-card .stars{font-size:26px;margin-bottom:6px}
.result-card .score-big{font-size:40px;font-weight:900;color:var(--red)}.result-card .score-lbl{font-size:11px;color:var(--sub);margin-bottom:10px}
.result-card .stats{display:flex;justify-content:center;gap:20px;margin-bottom:12px}.result-card .stats .item{text-align:center}.result-card .stats .item .v{font-size:18px;font-weight:700}.result-card .stats .item .l{font-size:10px;color:var(--sub)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="bg-deco"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
<div id="app">
<header id="gameHeader" class="hidden"><button class="back-btn" id="headerBack">‹</button><span class="header-title" id="headerTitle">记忆翻牌</span><span class="header-right" id="headerRight"></span></header>
<div class="game-area" id="gameArea">
  <div id="homeScreen" class="home-screen">
    <span class="logo">🃏</span><h1>记忆翻牌</h1><div class="subtitle">配对记忆训练</div>
    <div class="home-tagline">─ 过目不忘 记忆达人 ─</div>
    <div class="home-feats">
      <div class="feat"><span>🧠</span> 经典翻牌配对，训练工作记忆</div>
      <div class="feat"><span>📈</span> 4对→18对逐步增加难度</div>
      <div class="feat"><span>⏱️</span> 计时计步，挑战自我</div>
      <div class="feat"><span>💾</span> 自动存档，随时继续</div>
    </div>
    <button class="btn btn-red" id="startBtn">🚀 开始挑战</button>
    <div class="home-footer" style="font-size:10px;color:var(--sub);margin-top:14px;opacity:.5">思贤学习站 · 出品</div>
  </div>
  <div id="mapScreen" class="map-screen hidden">
    <h2>🗺️ 记忆之旅</h2><div class="map-progress">进度：<span id="mapProg">0</span> / <span id="mapTotal">6</span></div>
    <div class="map-path" id="mapPath"></div>
  </div>
  <div id="gameScreen" class="game-screen hidden">
    <div class="game-hd"><span class="lvl-name" id="lvlName">入门 · 4对</span><span class="score">⭐ <span id="gameScore">0</span></span></div>
    <div class="game-stats"><span>步数：<em id="moves">0</em></span><span>配对：<em id="pairs">0</em>/<em id="totalPairs">4</em></span><span id="memTimer">⏱️ <em id="memTime">0</em>s</span></div>
    <div class="card-grid" id="cardGrid"></div>
  </div>
  <div id="resultOverlay" class="result-overlay hidden">
    <div class="result-card"><div class="big-icon" id="resultIcon">🎉</div><div class="title" id="resultTitle">通关！</div><div class="sub" id="resultSub">太棒了</div><div class="stars" id="resultStars">⭐⭐⭐</div><div class="score-big" id="resultScore">0</div><div class="score-lbl">得分</div><div class="stats"><div class="item"><div class="v" id="rC">0</div><div class="l">步数</div></div><div class="item"><div class="v" id="rT">0</div><div class="l">用时</div></div><div class="item"><div class="v" id="rS">0</div><div class="l">得分</div></div></div>
    <button class="btn btn-red" id="resultBtn">下一关</button><button class="btn btn-outline" id="resultHomeBtn" style="margin-top:6px;font-size:13px">返回</button>
  </div></div>
</div></div>
<script>
const SAVE_KEY='memory_save';const PAIRS=[4,6,8,10,12,18];
const LEVELS=[{n:'入门',d:'4对·2×4'},{n:'初级',d:'6对·3×4'},{n:'进阶',d:'8对·4×4'},{n:'挑战',d:'10对·4×5'},{n:'高手',d:'12对·4×6'},{n:'大师',d:'18对·6×6'}];
const EMOJIS=['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🐤','🦆','🦅','🦉','🦇','🐺'];
let S=load()||{completed:{},stars:{},scores:{},points:0};let G={},memTimer=null;const $=id=>document.getElementById(id);
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}

function startLevel(i){
  G={idx:i,moves:0,pairs:0,score:0,sec:0,flipped:[],locked:false,done:false};
  showGame();const n=PAIRS[i];const ems=shuffle([...EMOJIS]).slice(0,n);
  let cards=[];ems.forEach((e,j)=>{cards.push({id:j*2,emoji:e,flipped:false,matched:false});cards.push({id:j*2+1,emoji:e,flipped:false,matched:false})});
  cards=shuffle(cards);G.cards=cards;G.total=n;renderGrid();
  $('lvlName').textContent=LEVELS[i].n+' · '+LEVELS[i].d;$('totalPairs').textContent=n;
  $('gameScore').textContent=G.score;$('moves').textContent=0;$('pairs').textContent=0;$('memTime').textContent=0;G.sec=0;
  if(memTimer)clearInterval(memTimer);memTimer=setInterval(()=>{G.sec++;$('memTime').textContent=G.sec},1000);
  $('gameHeader').classList.remove('hidden');$('gameScreen').classList.remove('hidden');$('headerBack').onclick=()=>{if(memTimer)clearInterval(memTimer);stopTimer();showMap()};
  hideAll();
}
function hideAll(){['homeScreen','mapScreen','gameScreen'].forEach(id=>$(id).classList.add('hidden'));$('gameHeader').classList.add('hidden')}
function renderGrid(){
  const g=$('cardGrid');g.innerHTML='';
  const n=G.total;let cols=4;
  if(n<=4)cols=4;else if(n<=6)cols=4;else if(n<=8)cols=4;else if(n<=10)cols=5;else if(n<=12)cols=4;else cols=6;
  g.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  G.cards.forEach((c,i)=>{
    const d=document.createElement('div');d.className='card';d.dataset.idx=i;
    d.innerHTML=`<div class="face front">?</div><div class="face back">${c.emoji}</div>`;
    if(c.matched){d.classList.add('matched','flipped')}
    d.addEventListener('click',()=>flip(i));
    g.appendChild(d);
  });
}
function flip(idx){
  if(G.locked||G.done)return;const c=G.cards[idx];if(c.matched||c.flipped)return;
  c.flipped=true;G.flipped.push(idx);renderGrid();
  const all=$('cardGrid').querySelectorAll('.card');
  if(c.matched)return;
  if(G.flipped.length===2){
    G.moves++;$('moves').textContent=G.moves;
    const [a,b]=G.flipped;const ca=G.cards[a],cb=G.cards[b];
    if(ca.emoji===cb.emoji&&a!==b){
      ca.matched=true;cb.matched=true;G.pairs++;$('pairs').textContent=G.pairs;
      const bonus=Math.max(0,30-G.sec);G.score+=10+Math.min(bonus,20);
      $('gameScore').textContent=G.score;sfxOk();G.flipped=[];
      if(G.pairs>=G.total){G.done=true;if(memTimer)clearInterval(memTimer);setTimeout(endLv,500)}
    }else{
      G.locked=true;sfxBad();
      setTimeout(()=>{ca.flipped=false;cb.flipped=false;G.flipped=[];G.locked=false;renderGrid()},700);
    }
  }
}
function endLv(){
  const ideal=G.total*2;const ratio=ideal/Math.max(G.moves,1);
  let st=0;if(ratio>=.9)st=3;else if(ratio>=.65)st=2;else if(ratio>=.4)st=1;
  const lid=LEVELS[G.idx].n;if(st>(S.stars[lid]||0))S.stars[lid]=st;
  if(G.score>(S.scores[lid]||0))S.scores[lid]=G.score;if(st>0)S.completed[lid]=true;S.points+=G.score;save();
  $('resultIcon').textContent=st>=2?'🎉':'💪';$('resultTitle').textContent=st>=2?'通关成功！':'继续加油！';
  $('resultSub').textContent=st===3?'完美记忆！':st===2?'记忆不错！':'再多练练！';
  $('resultStars').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);$('resultScore').textContent=G.score;
  $('rC').textContent=G.moves;$('rT').textContent=G.sec+'s';$('rS').textContent=G.score;
  if(G.idx+1>=LEVELS.length){$('resultBtn').textContent='🏆 全部通关！';$('resultBtn').onclick=()=>{hideR();showMap()};}
  else if(st>0){$('resultBtn').textContent='下一关 →';$('resultBtn').onclick=()=>{hideR();startLevel(G.idx+1)}}
  else{$('resultBtn').textContent='🔄 重新挑战';$('resultBtn').onclick=()=>{hideR();startLevel(G.idx)}}
  $('resultHomeBtn').onclick=()=>{hideR();showMap()};$('resultOverlay').classList.remove('hidden');if(st>0)sfxPass();else sfxDrop();
}
function showMap(){hideAll();$('gameHeader').classList.remove('hidden');$('mapScreen').classList.remove('hidden');const p=$('mapPath');p.innerHTML='';let done=0;Object.keys(S.completed).forEach(k=>done++);$('mapProg').textContent=done;$('mapTotal').textContent=LEVELS.length;LEVELS.forEach((lv,i)=>{if(i>0){const c=document.createElement('div');c.className='map-connector';c.textContent='▼';p.appendChild(c)}const n=document.createElement('div');const comp=S.completed[lv.n];const cur=i===0||S.completed[LEVELS[i-1].n];n.className='map-node'+(cur?' current':'')+(comp?' completed':'')+(!cur&&!comp?' locked':'');n.innerHTML=`<div class="icon">${!cur&&!comp?'🔒':comp?'✅':'🃏'}</div><div class="info"><div class="name">${lv.n}</div><div class="desc">${lv.d}</div></div><div class="status">${'⭐'.repeat(S.stars[lv.n]||0)}</div>`;if((!comp&&cur)||comp)n.addEventListener('click',()=>startLevel(i));p.appendChild(n);});$('headerTitle').textContent='记忆翻牌';$('headerRight').textContent=`⭐ ${S.points}`;$('headerBack').onclick=showHome;}
function showHome(){hideAll();$('homeScreen').classList.remove('hidden')}function hideR(){$('resultOverlay').classList.add('hidden')}
function stopTimer(){}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(SAVE_KEY);if(!r)return null;const s=JSON.parse(r);if(typeof s.stars!=='object')s.stars={};if(typeof s.scores!=='object')s.scores={};if(typeof s.completed!=='object')s.completed={};return s}catch(e){return null}}
let ac=null;function tone(f,d,t='sine'){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=0.05;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function sfxOk(){tone(880,.1)}function sfxBad(){tone(300,.15,'sawtooth')}function sfxPass(){tone(660,.08);setTimeout(()=>tone(880,.08),80);setTimeout(()=>tone(1100,.15),160)}function sfxDrop(){tone(400,.1);setTimeout(()=>tone(300,.2),100)}
$('startBtn').addEventListener('click',showMap);$('resultHomeBtn').addEventListener('click',()=>{hideR();showMap()});showHome();
</script>
</body>
</html>
