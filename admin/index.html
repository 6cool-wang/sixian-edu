<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>思贤学习站 · 后台管理</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: "Microsoft YaHei", sans-serif; background: #1a1a2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .loading { color: #fff; font-size: 18px; letter-spacing: 3px; }
    .loading::after { content: "···"; animation: dot 1.5s infinite; }
    @keyframes dot { 0%,20% { content: "···"; } 40% { content: "·"; } 60% { content: "··"; } 80%,100% { content: "···"; } }
  </style>
</head>
<body>
  <div class="loading">正在加载管理后台</div>
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/decap-cms@3/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'sixian-edu/sixian-edu',
          branch: 'master',
          base_url: 'https://sixian-cms-auth.workers.dev',
          auth_endpoint: 'oauth/authorize'
        },
        site_url: 'https://sixian-edu.github.io/sixian-edu',
        media_folder: 'images/uploads',
        collections: [
          {
            name: 'pages',
            label: '页面',
            files: [
              {
                name: 'ziliao',
                label: '资料库',
                file: '资料库.html',
                create: true,
                fields: [
                  { label: '内容', name: 'body', widget: 'text' }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
