<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>命理推演 · 八字五行</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #040203;
  color: #ece4d0;
  font-family: -apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
::selection { background: #c9952e44; color: #f0d68a; }

/* ===== Hero ===== */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  position: relative;
  background: radial-gradient(ellipse at 50% 30%, rgba(180,120,40,0.05) 0%, #040203 70%);
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 20% 30%, #ffffff22, transparent),
    radial-gradient(1px 1px at 40% 70%, #ffffff18, transparent),
    radial-gradient(1.5px 1.5px at 60% 20%, #c9952e33, transparent),
    radial-gradient(1px 1px at 80% 50%, #ffffff15, transparent),
    radial-gradient(1px 1px at 10% 80%, #ffffff18, transparent),
    radial-gradient(1.5px 1.5px at 70% 90%, #b91c1c33, transparent),
    radial-gradient(1px 1px at 90% 10%, #ffffff20, transparent),
    radial-gradient(1px 1px at 50% 50%, #ffffff10, transparent);
  pointer-events: none;
}
.hero::after {
  content: '';
  position: absolute;
  top: 30%; left: 50%;
  width: 400px; height: 400px;
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse, rgba(180,40,20,0.06) 0%, transparent 60%);
  pointer-events: none;
}

/* Hero Symbol (Tai Chi + rings) */
.hero-symbol {
  width: 240px; height: 240px;
  position: relative;
  margin-bottom: 40px;
  flex-shrink: 0;
}
.hero-svg { width:100%; height:100%; display:block; overflow:visible; }
.taiji-spin { transform-origin:0 0; animation:spin 10s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.hero h1 {
  font-size: clamp(42px, 8vw, 72px);
  font-weight: 300;
  letter-spacing: 12px;
  background: linear-gradient(135deg, #8a6020, #d4a847, #f5e0a0, #d4a847, #8a6020);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 12px;
  font-family: "Noto Serif SC","SimSun","STSong",serif;
}
.hero p {
  font-size: clamp(14px, 2.2vw, 18px);
  color: #c9952e;
  letter-spacing: 6px;
  margin-bottom: 40px;
  opacity: 0.8;
}
.hero .sub {
  font-size: 13px;
  color: #8a7030;
  letter-spacing: 4px;
  border-top: 1px solid #2a2a40;
  padding-top: 20px;
  max-width: 400px;
}

/* ===== Sections ===== */
.section {
  max-width: 720px;
  margin: 0 auto;
  padding: 60px 20px 80px;
}
.section-title {
  text-align: center;
  font-size: 22px;
  letter-spacing: 6px;
  color: #c9952e;
  margin-bottom: 40px;
  font-family: "Noto Serif SC","SimSun",serif;
  font-weight: 300;
}
.section-title::after {
  content: '';
  display: block;
  width: 40px;
  height: 1px;
  background: linear-gradient(90deg, transparent, #b91c1c, #c9952e, transparent);
  margin: 12px auto 0;
}

/* ===== Form ===== */
.form-card {
  background: linear-gradient(135deg, #0c0704, #100b06);
  border: 1px solid #1c130d;
  border-radius: 16px;
  padding: 40px 30px;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.form-row.hour-row {
  grid-template-columns: 1fr;
}
.form-group label {
  display: block;
  font-size: 12px;
  color: #8a7a6a;
  letter-spacing: 2px;
  margin-bottom: 6px;
}
.form-group select, .form-group input {
  width: 100%;
  padding: 10px 12px;
  background: #0a0a18;
  border: 1px solid #1c130d;
  border-radius: 8px;
  color: #e8e0d0;
  font-size: 15px;
  outline: none;
  transition: border-color .3s;
  -webkit-appearance: none;
  appearance: none;
}
.form-group select:focus, .form-group input:focus {
  border-color: #c9952e;
}
.form-group select option {
  background: #0a0a18;
  color: #e8e0d0;
}
.btn-primary {
  display: block;
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #8a6020, #d4a847, #8a6020);
  border: none;
  border-radius: 10px;
  color: #040203;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 6px;
  cursor: pointer;
  transition: all .3s;
  margin-top: 8px;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px #d4a84733;
}
.btn-primary:active {
  transform: translateY(0);
}
.hint {
  text-align: center;
  font-size: 12px;
  color: #605548;
  margin-top: 16px;
  letter-spacing: 1px;
}

/* ===== Loading ===== */
.loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #040203f0;
  z-index: 1000;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.loading-overlay.active {
  display: flex;
}
.loading-taiji {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: linear-gradient(to right, #040203 50%, #c9952e 50%);
  position: relative;
  animation: spin 1.5s linear infinite;
  margin-bottom: 30px;
}
.loading-taiji::before {
  content: ''; position: absolute;
  width: 40px; height: 40px; border-radius: 50%;
  background: #040203; left: 50%; top: 0;
  transform: translateX(-50%);
  box-shadow: inset 0 0 0 7px #c9952e;
}
.loading-taiji::after {
  content: ''; position: absolute;
  width: 40px; height: 40px; border-radius: 50%;
  background: #c9952e; left: 50%; top: 50%;
  transform: translateX(-50%);
  box-shadow: inset 0 0 0 7px #040203;
}
.loading-text {
  font-size: 18px;
  letter-spacing: 6px;
  color: #c9952e;
  font-family: "Noto Serif SC","SimSun",serif;
}
.loading-progress {
  margin-top: 20px;
  font-size: 14px;
  color: #605548;
  letter-spacing: 2px;
}

/* ===== Results ===== */
.results { display: none; background: radial-gradient(ellipse at 50% 0%, rgba(100,30,10,0.03) 0%, transparent 60%); }
.results.active { display: block; }

/* Four Pillars */
.pillars {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 50px;
}
.pillar-card {
  background: linear-gradient(180deg, #100b06, #0c0704);
  border: 1px solid #1c130d;
  border-radius: 14px;
  padding: 18px 10px 16px;
  text-align: center;
  position: relative;
  overflow: hidden;
  opacity: 0;
  transform: rotateY(90deg) scale(0.6);
  transition: all 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.pillar-card.visible { opacity: 1; transform: rotateY(0deg) scale(1); }
.pillar-card::before {
  content: '';
  position: absolute;
  top: 0; left: 20%; right: 20%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #b91c1c, #c9952e, transparent);
}
.pillar-label {
  font-size: 11px;
  color: #605548;
  letter-spacing: 3px;
  margin-bottom: 8px;
}
.pillar-gan {
  font-size: clamp(28px, 5vw, 36px);
  font-weight: 700;
  color: #f0d68a;
  font-family: "Noto Serif SC","SimSun",serif;
  line-height: 1.2;
}
.pillar-zhi {
  font-size: clamp(28px, 5vw, 36px);
  font-weight: 700;
  color: #e8e0d0;
  font-family: "Noto Serif SC","SimSun",serif;
  line-height: 1.2;
}
.pillar-wuxing {
  font-size: 12px;
  color: #a09080;
  margin-top: 6px;
  letter-spacing: 1px;
}

/* Canvas */
.chart-wrap {
  background: linear-gradient(135deg, #0c0704, #100b06);
  border: 1px solid #1c130d;
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  margin-bottom: 36px;
}
.chart-wrap canvas {
  display: block;
  margin: 0 auto;
  max-width: 100%;
}

/* Analysis */
.analysis-card {
  background: linear-gradient(135deg, #0c0704, #100b06);
  border: 1px solid #1c130d;
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 16px;
}
.analysis-card h3 {
  font-size: 15px;
  color: #c9952e;
  letter-spacing: 3px;
  margin-bottom: 12px;
  font-weight: 400;
  font-family: "Noto Serif SC","SimSun",serif;
}
.analysis-card p {
  font-size: 14px;
  line-height: 1.8;
  color: #c0b8a8;
}
.analysis-card .highlight {
  color: #f0d68a;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.tag {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12px;
  background: #1c130d;
  color: #c0b8a8;
  border: 1px solid #3a3a60;
}
.tag.wood { border-color: #27ae60; color: #6ddb9b; background: #27ae6015; }
.tag.fire { border-color: #c0392b; color: #e8857a; background: #c0392b15; }
.tag.earth { border-color: #d4a847; color: #f0d68a; background: #d4a84715; }
.tag.metal { border-color: #bdc3c7; color: #ecf0f1; background: #bdc3c715; }
.tag.water { border-color: #2980b9; color: #7fc4e8; background: #2980b915; }

/* Buttons */
.btn-group {
  display: flex;
  gap: 12px;
  margin-top: 30px;
}
.btn-secondary {
  flex: 1;
  padding: 12px;
  background: transparent;
  border: 1px solid #1c130d;
  border-radius: 10px;
  color: #a09080;
  font-size: 14px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all .3s;
}
.btn-secondary:hover {
  border-color: #c9952e;
  color: #f0d68a;
}
.btn-share {
  flex: 1;
  padding: 12px;
  background: linear-gradient(135deg, #8a6020, #d4a847);
  border: none;
  border-radius: 10px;
  color: #040203;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all .3s;
}
.btn-share:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px #d4a84733;
}

/* Footer */
.site-footer {
  text-align: center;
  padding: 40px 20px;
  font-size: 12px;
  color: #2a2a40;
  letter-spacing: 2px;
  border-top: 1px solid #100b06;
}

/* 纳音 */
.pillar-nayin {
  font-size: 11px;
  color: #605548;
  margin-top: 4px;
  letter-spacing: 1px;
  font-family: "Noto Serif SC","SimSun",serif;
}

/* 今日宜忌 */
.daily-advice {
  display: flex;
  gap: 24px;
}
.da-column { flex:1; }
.da-title {
  font-size: 12px;
  letter-spacing: 4px;
  margin-bottom: 8px;
  font-family: "Noto Serif SC","SimSun",serif;
}
.da-yi { color: #6ddb9b; }
.da-ji { color: #e8857a; }
.tag-yi { border-color:#27ae60; color:#6ddb9b; background:#27ae6015; }
.tag-ji { border-color:#c0392b; color:#e8857a; background:#c0392b15; }

/* 合盘 */
.he-pan { display:none; }
.he-pan.active { display:block; }
.compare-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
}
.compare-person {
  background: linear-gradient(180deg, #100b06, #0c0704);
  border: 1px solid #1c130d;
  border-radius: 14px;
  padding: 16px;
  text-align: center;
}
.compare-person .cp-label {
  font-size: 11px; color: #605548; letter-spacing: 2px; margin-bottom: 6px;
}
.compare-person .cp-pillars {
  display: grid; grid-template-columns: repeat(4,1fr); gap:4px; margin-top:8px;
}
.compare-person .cp-p {
  font-size:13px; font-family:"Noto Serif SC","SimSun",serif;
}
.compare-person .cp-p .g { color:#f0d68a; }
.compare-person .cp-p .z { color:#c0b8a8; }
.compat-score {
  text-align: center;
  margin: 20px 0;
}
.compat-ring {
  width: 120px; height: 120px;
  border-radius: 50%;
  background: conic-gradient(#d4a847 var(--pct,0%), #100b06 0%);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px;
  position: relative;
}
.compat-ring-inner {
  width: 90px; height: 90px;
  border-radius: 50%;
  background: #0c0704;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
}
.compat-ring-inner .num {
  font-size: 28px; color: #f0d68a; font-weight: 700;
  font-family: "Noto Serif SC","SimSun",serif;
}
.compat-ring-inner .lbl {
  font-size: 11px; color: #605548; letter-spacing: 2px;
}
.compat-detail { font-size:14px; color:#c0b8a8; line-height:1.8; text-align:center; }

/* 五行气场 */
.results.atmos-0 { background: radial-gradient(ellipse at 50% 0%, rgba(39,174,96,0.04) 0%, transparent 60%); }
.results.atmos-1 { background: radial-gradient(ellipse at 50% 0%, rgba(230,126,34,0.04) 0%, transparent 60%); }
.results.atmos-2 { background: radial-gradient(ellipse at 50% 0%, rgba(212,168,71,0.04) 0%, transparent 60%); }
.results.atmos-3 { background: radial-gradient(ellipse at 50% 0%, rgba(189,195,199,0.04) 0%, transparent 60%); }
.results.atmos-4 { background: radial-gradient(ellipse at 50% 0%, rgba(41,128,185,0.04) 0%, transparent 60%); }

/* 生肖 */
.pillar-zodiac { font-size: 22px; margin-top: 2px; line-height:1; }

/* 命格称号 */
.title-card {
  background: linear-gradient(135deg, #100b06, #0c0704);
  border: 1px solid #c9952e44;
  border-radius: 14px;
  padding: 28px 24px;
  margin-bottom: 16px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.title-card::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(185,28,28,0.08), transparent 70%);
}
.title-card h2 {
  font-size: 26px; font-weight: 400;
  color: #f0d68a;
  letter-spacing: 8px;
  font-family: "Noto Serif SC","SimSun",serif;
  margin-bottom: 6px;
}
.title-card .sub {
  font-size: 13px; color: #8a7a6a; letter-spacing: 3px;
}

/* 命理指数 */
.index-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 36px;
}
.index-item {
  text-align: center;
  padding: 16px 8px;
  background: linear-gradient(180deg, #100b06, #0c0704);
  border: 1px solid #1c130d;
  border-radius: 14px;
}
.index-ring-wrap {
  width: 72px; height: 72px;
  border-radius: 50%;
  margin: 0 auto 8px;
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
.index-ring-bg {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(var(--clr,#c9952e) var(--pct,0%), #100b06 0%);
}
.index-ring-inner {
  width: 54px; height: 54px;
  border-radius: 50%;
  background: #0c0704;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  z-index: 1;
}
.index-ring-inner .val {
  font-size: 18px; font-weight: 700; color: #f0d68a;
  font-family: "Noto Serif SC","SimSun",serif;
}
.index-label {
  font-size: 12px; color: #8a7a6a; letter-spacing: 2px;
}
.index-ring-inner .val.low { color:#e8857a; }
.index-ring-inner .val.mid { color:#f0b070; }
.index-ring-inner .val.high { color:#6ddb9b; }

/* 摇签 */
.qian-section {
  text-align: center;
  padding: 40px 0 20px;
  margin-top: 20px;
  border-top: 1px solid #100b06;
}
.qian-section .sec-label {
  font-size: 14px; color: #605548; letter-spacing: 4px; margin-bottom: 30px;
  font-family: "Noto Serif SC","SimSun",serif;
}
.qian-section .sec-label .ach-badge {
  display:inline-block; font-size:12px; color:#c9952e; letter-spacing:2px;
  margin-left:12px; cursor:pointer; padding:2px 10px; border:1px solid #c9952e33;
  border-radius:12px; transition:all .3s;
}
.qian-section .sec-label .ach-badge:hover { border-color:#c9952e; background:#c9952e11; }
.qian-setup { margin-bottom: 20px; }
.qian-tube {
  width: 100px; height: 130px;
  margin: 0 auto 24px;
  position: relative;
  border-radius: 6px 6px 20px 20px;
  background: linear-gradient(180deg, #8B4513, #654321);
  border: 2px solid #a0682088;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.qian-tube::after {
  content: ''; position: absolute;
  top: -6px; left: -6px; right: -6px; height: 14px;
  background: linear-gradient(180deg, #a06830, #8B4513);
  border-radius: 6px 6px 0 0;
  border: 2px solid #a0682088;
  border-bottom: none;
}
.qian-stick {
  position: absolute;
  bottom: 65%;
  width: 3px;
  height: 55px;
  background: linear-gradient(to top, #f0d68a, #d4a847);
  border-radius: 2px;
  transform-origin: bottom center;
  transition: transform 0.3s;
}
.qian-stick.fly {
  animation: qianFly 0.8s ease-out forwards;
}
@keyframes qianFly {
  0% { transform: translateY(0) rotate(0deg); opacity:1; }
  100% { transform: translateY(-80px) rotate(15deg); opacity:0; }
}
@keyframes qianShake {
  0%,100% { transform: rotate(0deg); }
  15% { transform: rotate(-6deg); }
  30% { transform: rotate(6deg); }
  45% { transform: rotate(-4deg); }
  60% { transform: rotate(4deg); }
  75% { transform: rotate(-2deg); }
  90% { transform: rotate(2deg); }
}
.qian-tube.shake { animation: qianShake 0.7s ease-in-out; }

.qian-card {
  max-width: 400px;
  margin: 0 auto;
  padding: 30px 24px;
  background: linear-gradient(135deg, #100b06, #0c0704);
  border: 1px solid #c9952e33;
  border-radius: 16px;
  opacity: 0;
  transform: translateY(20px) scale(0.95);
  transition: all .6s cubic-bezier(0.34,1.56,0.64,1);
  position: relative;
}
.qian-card.visible { opacity: 1; transform: translateY(0) scale(1); }
/* Rarity glow */
.qian-card.r-da-ji { border-color:#f0d68a; box-shadow:0 0 40px #d4a84744,0 0 80px #d4a84722,inset 0 0 30px #d4a84711; }
.qian-card.r-ji { border-color:#9b59b6; box-shadow:0 0 25px #9b59b644,inset 0 0 20px #9b59b611; }
.qian-card.r-zhong-ji { border-color:#3498db; box-shadow:0 0 15px #3498db33; }
.qian-card.r-zhong-ping { border-color:#27ae60; box-shadow:0 0 10px #27ae6022; }
.qian-card.r-mo-ji { border-color:#7f8c8d; }
/* Combo */
.combo-display {
  font-size: 14px; color: #c9952e; letter-spacing: 2px; margin-bottom: 16px;
  min-height: 24px;
}
.combo-disbo .num { font-weight:700; font-size:18px; }
.combo-display .fire { color:#e74c3c; }
.qian-card .fortune {
  font-size: 32px; margin-bottom: 8px;
}
.qian-card .qian-type {
  font-size: 14px; letter-spacing: 4px; margin-bottom: 12px;
  font-family: "Noto Serif SC","SimSun",serif;
}
.qian-card .qian-type.da-ji { color: #e74c3c; }
.qian-card .qian-type.ji { color: #6ddb9b; }
.qian-card .qian-type.zhong-ji { color: #f0b070; }
.qian-card .qian-type.zhong-ping { color: #a09080; }
.qian-card .qian-type.mo-ji { color: #8a7a6a; }
.qian-card .qian-poem {
  font-size: 16px; line-height: 1.8; color: #c0b8a8;
  font-family: "Noto Serif SC","SimSun",serif;
  margin-bottom: 8px;
}
.qian-card .qian-desc {
  font-size: 13px; color: #605548; line-height: 1.6;
}

/* 成就系统 */
.ach-panel { display:none; margin-top:12px; }
.ach-panel.active { display:block; }
.ach-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
.ach-item {
  background:#0c0704; border:1px solid #1c130d; border-radius:12px;
  padding:12px; text-align:center; transition:all .3s;
}
.ach-item.locked { opacity:0.4; filter:grayscale(0.8); }
.ach-item.unlocked { border-color:#c9952e44; }
.ach-item .ach-icon { font-size:24px; margin-bottom:4px; }
.ach-item .ach-name { font-size:12px; color:#c0b8a8; letter-spacing:1px; margin-bottom:2px; }
.ach-item .ach-desc { font-size:10px; color:#605548; }

function playTone(freq, dur, type, vol) {
  try {
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(); const g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = freq; o.type = type || 'sine';
    g.gain.setValueAtTime(vol||0.15, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+(dur||0.3));
    o.start(); o.stop(ac.currentTime+(dur||0.3));
  } catch(e){} // silent fallback
}

function playFanfare(type) {
  if (type === 'da-ji') {
    playTone(523,0.15,'sine',0.12); setTimeout(()=>playTone(659,0.15,'sine',0.12),100);
    setTimeout(()=>playTone(784,0.3,'sine',0.12),200);
  } else if (type === 'ji') {
    playTone(440,0.2,'sine',0.1); setTimeout(()=>playTone(554,0.3,'sine',0.1),120);
  } else {
    playTone(392,0.25,'triangle',0.08);
  }
}

function burstParticles(color, count, x, y) {
  const c = document.createElement('canvas');
  c.style.cssText = 'position:fixed;inset:0;z-index:999;pointer-events:none';
  c.width = window.innerWidth; c.height = window.innerHeight;
  document.body.appendChild(c);
  const ctx = c.getContext('2d');
  const pts = [];
  const cx = x || c.width/2, cy = y || c.height/2;
  const colors = color ? [color] : ['#f0d68a','#e74c3c','#9b59b6','#3498db','#27ae60','#e67e22'];
  for (let i = 0; i < (count||40); i++) {
    const a = Math.random()*Math.PI*2, sp = 3+Math.random()*8;
    pts.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-2,
      life:1, sz:2+Math.random()*4, clr:colors[Math.floor(Math.random()*colors.length)] });
  }
  let run = true;
  function fr() {
    if(!run)return;
    ctx.clearRect(0,0,c.width,c.height);
    let alive=false;
    pts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.life-=0.018;
      if(p.life<=0)return; alive=true;
      ctx.globalAlpha=p.life; ctx.fillStyle=p.clr;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2); ctx.fill();
    });
    if(alive) requestAnimationFrame(fr);
    else { document.body.removeChild(c); run=false; }
  }
  fr();
}

function shakeQian() {
  const tube = document.getElementById('qianTube');
  const resultDiv = document.getElementById('qianResult');
  const btn = document.getElementById('qianBtn');
  if (!tube || tube.classList.contains('shake')) return;
  btn.disabled = true;
  tube.classList.remove('shake');
  void tube.offsetWidth;
  tube.classList.add('shake');
  resultDiv.innerHTML = '';

  setTimeout(() => {
    const sticks = tube.querySelectorAll('.qian-stick');
    if (sticks.length > 0) {
      const idx = Math.floor(Math.random() * sticks.length);
      sticks[idx].classList.add('fly');
    }
  }, 350);

  setTimeout(() => {
    tube.classList.remove('shake');
    qianCombo++;
    // Weighted draw: higher combo = better odds
    let pool = [...QIAN_POOL];
    if (qianCombo >= 3) pool = QIAN_POOL.filter(q => q.type !== '末吉');
    if (qianCombo >= 5) pool = QIAN_POOL.filter(q => q.type === '大吉' || q.type === '吉' || q.type === '中吉');
    const q = pool[Math.floor(Math.random() * pool.length)];
    const typeCls = q.type === '大吉' ? 'da-ji' : q.type === '吉' ? 'ji' : q.type === '中吉' ? 'zhong-ji' : q.type === '中平' ? 'zhong-ping' : 'mo-ji';
    const rarityCls = 'r-' + typeCls;

    playFanfare(typeCls);
    if (q.type === '大吉') { burstParticles('#f0d68a', 60); if (unlockAch('da_ji')) renderAchPanel(); }
    else if (q.type === '吉') burstParticles('#9b59b6', 30);

    // Achievements
    if (qianCombo >= 5 && unlockAch('combo_5')) renderAchPanel();
    if (qianCombo >= 10 && unlockAch('combo_10')) renderAchPanel();
    const totalQian = parseInt(localStorage.getItem('wm_totalQian')||'0') + 1;
    localStorage.setItem('wm_totalQian', totalQian);
    if (totalQian >= 30 && unlockAch('qian_master')) renderAchPanel();

    const comboHtml = qianCombo > 1 ? `<div class="combo-display">🔥 连击 <span class="fire">×${qianCombo}</span></div>` : '';

    resultDiv.innerHTML = `<div class="qian-card ${rarityCls}" id="qianCard">
      ${comboHtml}
      <div class="fortune">${q.emoji}</div>
      <div class="qian-type ${typeCls}" style="color:${q.type==='大吉'?'#f0d68a':q.type==='吉'?'#9b59b6':q.type==='中吉'?'#3498db':q.type==='中平'?'#27ae60':'#7f8c8d'}">${q.type}</div>
      <div class="qian-poem">${q.poem}</div>
      <div class="qian-desc">${q.desc}</div>
      <button class="btn-secondary" onclick="resetQian()" style="margin-top:16px;font-size:13px;padding:8px">再摇一次</button>
    </div>`;
    setTimeout(() => {
      document.getElementById('qianCard').classList.add('visible');
      resultDiv.scrollIntoView({ behavior:'smooth', block:'center' });
      btn.disabled = false;
    }, 100);
  }, 1100);

// ===== 运势折线图 =====
function drawFortuneLine(dayGan, cnt) {
  const canvas = document.getElementById('fortuneChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  const pad = { t:18, b:24, l:28, r:10 };
  const cw = W-pad.l-pad.r, ch = H-pad.t-pad.b;

  // Generate 12 months
  const base = 40 + cnt[GAN_WX[dayGan]] * 5;
  const vals = [];
  const now = new Date();
  for (let i = 0; i < 12; i++) {
    const m = (now.getMonth() + i) % 12;
    let v = base + Math.sin(i*0.7+dayGan)*12 + (Math.random()-0.5)*14;
    if ([0,1,10].includes(GAN_WX[dayGan]) && [1,2,3].includes(m)) v += 12;
    if ([1,2,6].includes(GAN_WX[dayGan]) && [4,5,6].includes(m)) v += 12;
    if ([2,5,7].includes(GAN_WX[dayGan]) && [2,5,7,10].includes(m)) v += 8;
    if ([3,6,7].includes(GAN_WX[dayGan]) && [7,8,9].includes(m)) v += 12;
    if ([4,8,9].includes(GAN_WX[dayGan]) && [10,11,0].includes(m)) v += 12;
    vals.push(Math.max(10, Math.min(95, v)));
  }

  const pts = vals.map((v,i) => ({
    x: pad.l + (i/11)*cw, y: pad.t + ch*(1-(v-5)/90)
  }));

  // Grid
  for (let i = 0; i <= 3; i++) {
    const y = pad.t + ch*i/3;
    ctx.strokeStyle='#1e1e38'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    ctx.fillStyle='#605548'; ctx.font='8px sans-serif'; ctx.textAlign='right';
    ctx.fillText(Math.round(95-i*30), pad.l-4, y+3);
  }

  // Gradient fill
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pad.t+ch);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(pts[11].x, pad.t+ch); ctx.closePath();
  const g = ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
  g.addColorStop(0,'rgba(212,168,71,0.12)'); g.addColorStop(1,'rgba(212,168,71,0.01)');
  ctx.fillStyle=g; ctx.fill();

  // Line
  ctx.beginPath();
  pts.forEach((p,i)=> i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
  ctx.strokeStyle='#d4a847'; ctx.lineWidth=2; ctx.stroke();

  // Dots + labels
  const mN=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const sm = now.getMonth();
  pts.forEach((p,i)=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2);
    ctx.fillStyle='#d4a847'; ctx.fill();
    ctx.strokeStyle='#f0d68a'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='#605548'; ctx.font='8px sans-serif'; ctx.textAlign='center';
    ctx.fillText(mN[(sm+i)%12], p.x, pad.t+ch+14);
  });

  // Baseline
  ctx.fillStyle='#3a3a60'; ctx.font='8px sans-serif'; ctx.textAlign='left';
  ctx.fillText('未来12月趋势', pad.l, 10);
}

    setTimeout(() => {
      el.textContent = QUOTES[quoteIdx];
      el.style.opacity = '1';

}

// ===== 五行相生相克环 =====
function drawWxCycle(cnt) {
  const canvas = document.getElementById('wxCycle');
  if (!canvas) return null;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2, R = 72;

  const WX = ['木','火','土','金','水'];
  const COLORS = ['#27ae60','#e67e22','#d4a847','#bdc3c7','#2980b9'];
  const GLOWS = ['rgba(39,174,96,0.25)','rgba(230,126,34,0.25)','rgba(212,168,71,0.25)','rgba(189,195,199,0.25)','rgba(41,128,185,0.25)'];

  // 相生: 木→火→土→金→水→木 (pentagon edges, clockwise)
  const SHENG = [[0,1],[1,2],[2,3],[3,4],[4,0]];
  // 相克: 木→土→水→火→金→木 (star, counter-clockwise)
  const KE = [[0,2],[2,4],[4,1],[1,3],[3,0]];

  // Node positions
  const nodes = [];
  for (let i = 0; i < 5; i++) {
    const a = Math.PI/2 - i * 2*Math.PI/5;
    nodes.push({ x: cx + R * Math.cos(a), y: cy - R * Math.sin(a), label: WX[i], color: COLORS[i], val: cnt[i] });
  }

  let t = 0, animId = null;

  function draw() {
    ctx.clearRect(0, 0, W, H);
    t += 0.006;

    // Draw 相生 arrows (outward arcs)
    SHENG.forEach(([from, to]) => {
      const f = nodes[from], tn = nodes[to];
      const mx = (f.x + tn.x) / 2, my = (f.y + tn.y) / 2;
      const dx = mx - cx, dy = my - cy, dist = Math.sqrt(dx*dx + dy*dy);
      const nx = -dy/dist * 22, ny = dx/dist * 22;
      ctx.beginPath(); ctx.moveTo(f.x, f.y);
      ctx.quadraticCurveTo(mx + nx, my + ny, tn.x, tn.y);
      ctx.strokeStyle = 'rgba(212,168,71,0.12)'; ctx.lineWidth = 2; ctx.stroke();
    });

    // Draw 相克 arrows (inward arcs, dashed)
    KE.forEach(([from, to]) => {
      const f = nodes[from], tn = nodes[to];
      const mx = (f.x + tn.x) / 2, my = (f.y + tn.y) / 2;
      const dx = mx - cx, dy = my - cy, dist = Math.sqrt(dx*dx + dy*dy);
      const nx = -dy/dist * 18, ny = dx/dist * 18;
      ctx.beginPath(); ctx.moveTo(f.x, f.y);
      ctx.quadraticCurveTo(mx - nx*0.8, my - ny*0.8, tn.x, tn.y);
      ctx.strokeStyle = 'rgba(200,60,60,0.1)'; ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
    });

    // Flowing dots on 相生 (clockwise)
    SHENG.forEach(([from, to], idx) => {
      const f = nodes[from], tn = nodes[to];
      const mx = (f.x + tn.x) / 2, my = (f.y + tn.y) / 2;
      const dx = mx - cx, dy = my - cy, dist = Math.sqrt(dx*dx + dy*dy);
      const nx = -dy/dist * 22, ny = dx/dist * 22;
      const progress = (t + idx * 0.2) % 1;
      const p1 = 1 - progress;
      const px = p1*p1*f.x + 2*p1*progress*(mx+nx) + progress*progress*tn.x;
      const py = p1*p1*f.y + 2*p1*progress*(my+ny) + progress*progress*tn.y;
      ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(212,168,71,0.6)'; ctx.fill();
    });

    // Flowing dots on 相克 (counter-clockwise)
    KE.forEach(([from, to], idx) => {
      const f = nodes[from], tn = nodes[to];
      const mx = (f.x + tn.x) / 2, my = (f.y + tn.y) / 2;
      const dx = mx - cx, dy = my - cy, dist = Math.sqrt(dx*dx + dy*dy);
      const nx = -dy/dist * 18, ny = dx/dist * 18;
      const progress = (1 - t + idx * 0.25) % 1;
      const p1 = 1 - progress;
      const px = p1*p1*f.x + 2*p1*progress*(mx-nx*0.8) + progress*progress*tn.x;
      const py = p1*p1*f.y + 2*p1*progress*(my-ny*0.8) + progress*progress*tn.y;
      ctx.beginPath(); ctx.arc(px, py, 2.5, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(200,60,60,0.45)'; ctx.fill();
    });

    // Draw nodes
    nodes.forEach((n, i) => {
      // Glow
      ctx.beginPath(); ctx.arc(n.x, n.y, 26, 0, Math.PI*2);
      ctx.fillStyle = GLOWS[i]; ctx.fill();
      // Circle
      ctx.beginPath(); ctx.arc(n.x, n.y, 15, 0, Math.PI*2);
      ctx.fillStyle = '#0c0704'; ctx.fill();
      ctx.strokeStyle = n.color; ctx.lineWidth = 2; ctx.stroke();
      // Label
      ctx.fillStyle = n.color;
      ctx.font = '14px "Noto Serif SC","SimSun",serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(n.label, n.x, n.y);
      // Value
      ctx.fillStyle = '#605548'; ctx.font = '9px sans-serif';
      ctx.textBaseline = 'top';
      ctx.fillText(n.val + '', n.x, n.y + 18);
    });

    // Legend
    ctx.fillStyle = '#3a3a60'; ctx.font = '9px sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText('━ 相生', 10, H-14);
    ctx.strokeStyle = 'rgba(212,168,71,0.4)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(14, H-20); ctx.lineTo(28, H-20); ctx.stroke();
    ctx.fillText('╌ 相克', 70, H-14);
    ctx.strokeStyle = 'rgba(200,60,60,0.3)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(74, H-20); ctx.lineTo(88, H-20); ctx.stroke(); ctx.setLineDash([]);

    ctx.fillStyle = '#3a3a60'; ctx.font = '8px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('生为促进 · 克为制约', W-8, H-6);

    animId = requestAnimationFrame(draw);
  }
  draw();
  return () => { if (animId) cancelAnimationFrame(animId); };
}

// ===== CORE CALCULATION =====
function isLeap(y) { return (y%4===0 && y%100!==0) || y%400===0; }

function getYearGZ(year) {
  return { gan:(year-4)%10, zhi:(year-4)%12 };
}

// Approximate 节气 dates for 月柱
const JIE = [[2,4],[3,6],[4,5],[5,6],[6,6],[7,7],[8,8],[9,8],[10,8],[11,7],[12,7],[1,6]];

function getMonthZhi(year, month, day) {
  // JIE[i] = [month, day] of 节, starting from 立春(寅)
  // JIE[i] starts month with 地支 = (i+2)%12
  for (let i = 0; i < JIE.length; i++) {
    const [jm, jd] = JIE[i];
    if (month < jm || (month === jm && day < jd)) {
      return (i + 1) % 12;
    }
  }
  // Past all JIE entries: Dec→子(0), Jan→丑(1)
  return month === 12 ? 0 : 1;
}

function getMonthGZ(yearGan, zhi) {
  // 五虎遁: 年干→寅月天干
  const RULES = [2,4,6,8,0]; // 甲己丙,乙庚戊,丙辛庚,丁壬壬,戊癸甲
  const yinGan = RULES[yearGan % 5];
  const gan = (yinGan + (zhi - 2 + 12) % 12) % 10;
  return { gan, zhi };
}

function getDayGZ(year, month, day) {
  let total = 0;
  for (let y = 1900; y < year; y++) total += isLeap(y) ? 366 : 365;
  const MD = [31,28,31,30,31,30,31,31,30,31,30,31];
  for (let m = 0; m < month - 1; m++) total += MD[m];
  if (month > 2 && isLeap(year)) total++;
  total += day - 1;
  // 1900-01-01 is 庚子日 (天干6, 地支0)
  return { gan: (6 + total) % 10, zhi: total % 12 };
}

function getHourGZ(dayGan, hourIdx) {
  // 五鼠遁: 日干→子时天干
  const RULES = [0,2,4,6,8]; // 甲己甲,乙庚丙,丙辛戊,丁壬庚,戊癸壬
  const ziGan = RULES[dayGan % 5];
  const gan = (ziGan + hourIdx) % 10;
  return { gan, zhi: hourIdx };
}

function countWx(pillars) {
  const cnt = [0,0,0,0,0];
  pillars.forEach(p => {
    cnt[GAN_WX[p.gan]]++;
    cnt[ZHI_WX[p.zhi]]++;
  });
  return cnt;
}

function getWxSummary(cnt) {
  const total = cnt.reduce((a,b)=>a+b,0);
  const sorted = cnt.map((v,i)=>({ wx:i, val:v, pct:v/total*100 }))
    .sort((a,b)=>b.val-a.val);
  const dominant = sorted[0];
  const missing = cnt.map((v,i)=>v===0?i:-1).filter(i=>i>=0);
  return { sorted, dominant, missing, total };
}

function getBalanceDesc(cnt) {
  const vals = cnt.filter(v => v > 0);
  if (vals.length >= 4) return '五行俱全，格局平衡，运势亨通。';
  if (vals.length === 3) return '五行较为均衡，稍有偏缺，整体平稳。';
  if (vals.length <= 2) return '五行偏枯，需注意调和，以达平衡。';
  return '';
}

function drawChart(cnt) {
  const canvas = document.getElementById('wxChart');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2, R = Math.min(cx, cy) - 30;
  ctx.clearRect(0,0,W,H);

  // Grid
  for (let ring = 1; ring <= 5; ring++) {
    const r = R * ring / 5;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = Math.PI/2 - i * 2*Math.PI/5;
      const x = cx + r * Math.cos(a);
      const y = cy - r * Math.sin(a);
      i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = ring === 5 ? '#3a3a60' : '#1e1e38';
    ctx.lineWidth = ring === 5 ? 1 : 0.5;
    ctx.stroke();
  }
  // Center lines
  for (let i = 0; i < 5; i++) {
    const a = Math.PI/2 - i * 2*Math.PI/5;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * Math.cos(a), cy - R * Math.sin(a));
    ctx.strokeStyle = '#1e1e38';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Labels
  const WX_NAMES = ['木','火','土','金','水'];
  for (let i = 0; i < 5; i++) {
    const a = Math.PI/2 - i * 2*Math.PI/5;
    const lx = cx + (R + 20) * Math.cos(a);
    const ly = cy - (R + 20) * Math.sin(a);
    ctx.fillStyle = ['#6ddb9b','#f0b070','#f0d68a','#ecf0f1','#7fc4e8'][i];
    ctx.font = '14px "Noto Serif SC","SimSun",serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(WX_NAMES[i], lx, ly);
  }

  // Data polygon
  const maxVal = Math.max(...cnt, 1);
  const drawVal = cnt.map(v => Math.max(v / (maxVal || 1), 0.05));

  // Fill
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = Math.PI/2 - i * 2*Math.PI/5;
    const r = R * drawVal[i];
    const x = cx + r * Math.cos(a);
    const y = cy - r * Math.sin(a);
    i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(212,168,71,0.12)';
  ctx.fill();
  ctx.strokeStyle = '#d4a847';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Data points
  for (let i = 0; i < 5; i++) {
    const a = Math.PI/2 - i * 2*Math.PI/5;
    const r = R * drawVal[i];
    const x = cx + r * Math.cos(a);
    const y = cy - r * Math.sin(a);
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI*2);
    ctx.fillStyle = '#d4a847';
    ctx.fill();
    ctx.strokeStyle = '#f0d68a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Center value
  const total = cnt.reduce((a,b)=>a+b,0);
  ctx.fillStyle = '#605548';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(total + ' 元素', cx, cy);
}

    const poemIdx = curGZ.gan % 5;
    const p2 = PERSONALITY[curGZ.gan];
    html += `<div class="analysis-card fade-in"><h3>${now.getFullYear()}年流年 · ${TIAN_GAN[curGZ.gan]}${DI_ZHI[curGZ.zhi]}</h3>
      <p>流年天干「${p2.name}」主事：${YEAR_POEMS[poemIdx]}</p>
      <p style="margin-top:8px;font-size:13px;color:#a09080;">
      ${curGZ.gan === dayGan ? '今年与日主伏吟，宜静不宜动，稳守为佳。' :
        GAN_WX[curGZ.gan] === GAN_WX[dayGan] ? '流年五行与日主比和，顺势而为，多有收获。' :
        (GAN_WX[curGZ.gan] + 1) % 5 === GAN_WX[dayGan] ? '流年五行生日主，贵人相助，事半功倍。' :
        GAN_WX[dayGan] === (GAN_WX[curGZ.gan] + 1) % 5 ? '流年五行被日主所生，付出之年，劳而有得。' :
        (GAN_WX[curGZ.gan] + 2) % 5 === GAN_WX[dayGan] ? '流年克日主，压力较大，需谨言慎行。' :
        GAN_WX[dayGan] === (GAN_WX[curGZ.gan] + 2) % 5 ? '日主克流年，虽有挑战，可化险为夷。' :
        '流年与日主相安，平稳过渡。'}
      </p></div>`;
  }

  // Guidance
  html += `<div class="analysis-card fade-in"><h3>人生指引</h3><p>`;
  const dirs = ['东','南','中','西','北'];
  const bef = [];
  cnt.forEach((v,i) => { if (v <= 1) bef.push(`<span class="highlight">${dirs[i]}方</span>`); });
  if (bef.length > 0) html += `宜多向${bef.join('、')}活动，以补不足之气。`;
  html += `命理格局乃先天之数，而后天之努力同样重要。知命而不认命，顺势而为，方为智者之道。</p>
    <div class="tags">`;
  cnt.forEach((v,i) => {
    html += `<span class="tag ${wxTags[i]}">${v === 0 ? wxNames[i]+'缺' : wxNames[i]+v}</span>`;
  });
  html += `</div></div>`;
  html += `<button class="listen-btn fade-in" id="listenBtn" onclick="speakAnalysis()">🎧 聆听天命</button>`;

  document.getElementById('analysisContainer').innerHTML = html;
}

function getDailyTips(cnt, dayGan, dayZhi) {
  const yi = [], ji = [];
  // Based on missing elements
  cnt.forEach((v,i) => {
    if (v === 0) {
      yi.push(`补${WX_TRAITS[i].name}气`);
      yi.push(`向${WX_TRAITS[i].dir}行`);
    }
  });
  // Dominant element
  const max = Math.max(...cnt);
  cnt.forEach((v,i) => {
    if (v === max && v >= 3) ji.push(`勿过${WX_TRAITS[i].name}`);
  });
  if (dayGan % 2 === 0) yi.push('宜出头主动') ; else yi.push('宜静观其变');
  if (dayZhi === 0 || dayZhi === 11) yi.push('宜深思熟虑');
  if (dayZhi >= 5 && dayZhi <= 6) ji.push('忌冲动决策');
  if (cnt[2] === 0) ji.push('忌根基不稳');
  if (cnt[0] === 0) yi.push('多接触自然');
  if (cnt[1] === 0) yi.push('多晒太阳');
  if (cnt[3] === 0) yi.push('佩戴金属饰');
  if (cnt[4] === 0) yi.push('多近水');
  yi.push('保持平常心');
  ji.push('忌过度焦虑');
  // Deduplicate & limit
  return { yi:[...new Set(yi)].slice(0,6), ji:[...new Set(ji)].slice(0,4) };
}

function runHePan() {
  const y1 = +document.getElementById('birthYear').value;
  const m1 = +document.getElementById('birthMonth').value;
  const d1 = +document.getElementById('birthDay').value;
  const h1 = +document.getElementById('birthHour').value;
  const y2 = +document.getElementById('hpYear').value;
  const m2 = +document.getElementById('hpMonth').value;
  const d2 = +document.getElementById('hpDay').value;
  const h2 = +document.getElementById('hpHour').value;

  const p1 = calcSinglePillars(y1,m1,d1,h1);
  const p2 = calcSinglePillars(y2,m2,d2,h2);
  const c1 = countWx(p1), c2 = countWx(p2);
  const dayGan1 = getDayGZ(y1,m1,d1).gan, dayGan2 = getDayGZ(y2,m2,d2).gan;

  // Compatibility score: 五行差值 + 日干相生 + 同元素
  let score = 50;
  // 五行相似度 (up to +20)
  let diff = 0;
  for (let i = 0; i < 5; i++) diff += Math.abs(c1[i] - c2[i]);
  score += Math.max(0, 20 - diff * 2);
  // 日干关系 (up to +15)
  const w1 = GAN_WX[dayGan1], w2 = GAN_WX[dayGan2];
  if (w1 === w2) score += 8; // same element
  else if ((w1 + 1) % 5 === w2 || (w2 + 1) % 5 === w1) score += 15; // 相生
  else if ((w1 + 2) % 5 === w2 || (w2 + 2) % 5 === w1) score += 5; // 相克
  // 共同五行 (up to +15)
  const common = c1.filter((v,i) => v > 0 && c2[i] > 0).length;
  score += common * 3;
  score = Math.min(100, Math.max(0, Math.round(score)));
  if (score >= 85 && unlockAch('compat_high')) renderAchPanel();

  // Render
  const wxNames = ['木','火','土','金','水'];
  const tags = ['wood','fire','earth','metal','water'];
  const p1Html = p1.map(p => `<span class="cp-p"><span class="g">${TIAN_GAN[p.gan]}</span><span class="z">${DI_ZHI[p.zhi]}</span></span>`).join('');
  const p2Html = p2.map(p => `<span class="cp-p"><span class="g">${TIAN_GAN[p.gan]}</span><span class="z">${DI_ZHI[p.zhi]}</span></span>`).join('');

  let w1Html = '', w2Html = '';
  c1.forEach((v,i) => { w1Html += `<span class="tag ${tags[i]}" style="font-size:11px;padding:2px 8px">${wxNames[i]}${v}</span>`; });
  c2.forEach((v,i) => { w2Html += `<span class="tag ${tags[i]}" style="font-size:11px;padding:2px 8px">${wxNames[i]}${v}</span>`; });

  const rel = w1 === w2 ? '五行比和' :
    (w1 + 1) % 5 === w2 ? '你生对方' :
    (w2 + 1) % 5 === w1 ? '对方生你' :
    (w1 + 2) % 5 === w2 ? '你克对方' :
    (w2 + 2) % 5 === w1 ? '对方克你' : '相安';

  document.getElementById('hpResult').innerHTML = `
    <div class="compare-cards">
      <div class="compare-person">
        <div class="cp-label">你</div>
        <div class="cp-pillars">${p1Html}</div>
        <div style="margin-top:6px">${w1Html}</div>
      </div>
      <div class="compare-person">
        <div class="cp-label">对方</div>
        <div class="cp-pillars">${p2Html}</div>
        <div style="margin-top:6px">${w2Html}</div>
      </div>
    </div>
    <div class="compat-score fade-in">
      <div class="compat-ring" style="--pct:${score}%"><div class="compat-ring-inner">
        <div class="num">${score}</div><div class="lbl">匹配度</div>
      </div></div>
      <div class="compat-detail">${rel} · ${score >= 80 ? '天作之合，五行调和' : score >= 60 ? '较为合拍，互补性强' : score >= 40 ? '中平之缘，需互相包容' : '缘分较浅，相处需多磨合'}</div>
    </div>`;
  setTimeout(() => {
    document.querySelectorAll('.compat-score').forEach(el => el.classList.add('visible'));
    document.getElementById('hpResult').scrollIntoView({ behavior:'smooth', block:'center' });
  }, 100);
}

    cx.fillStyle = '#605548'; cx.font = '11px sans-serif';
    cx.fillText(getNaYin(p.gan,p.zhi), x+pw/2, y+114);
  });

  // Mini chart
  const cnt = countWx(pillars);
  const R = 80, ccx = W/2, ccy = 350;
  const wxNames = ['木','火','土','金','水'];
  const colors = ['#6ddb9b','#f0b070','#f0d68a','#ecf0f1','#7fc4e8'];
  const maxVal = Math.max(...cnt, 1);

  // grid
  for (let ri = 1; ri <= 4; ri++) {
    const rr = R * ri / 4;
    cx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = Math.PI/2 - i*2*Math.PI/5;
      const px = ccx + rr*Math.cos(a), py = ccy - rr*Math.sin(a);
      i===0 ? cx.moveTo(px,py) : cx.lineTo(px,py);
    }
    cx.closePath(); cx.strokeStyle = '#1e1e38'; cx.lineWidth = 0.5; cx.stroke();
  }
  // data
  const dv = cnt.map(v => Math.max(v/maxVal, 0.1));
  cx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = Math.PI/2 - i*2*Math.PI/5;
    const r = R * dv[i], px = ccx + r*Math.cos(a), py = ccy - r*Math.sin(a);

  link.download = '命理推演_' + new Date().toISOString().slice(0,10) + '.png';
  link.href = c.toDataURL('image/png');
  link.click();
}

function rx(x,y,w,h,r,ctx) {
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
  ctx.fill(); ctx.stroke();
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, c2) {
  const chars = text.split('');
  let line = '', ly = y;
  for (const ch of chars) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line) {
      c2.fillText(line, x, ly);
      line = ch; ly += lineHeight;
    } else line = test;
  }
  if (line) c2.fillText(line, x, ly);
}

  { name:'乾', symbol:'☰', meaning:'天', fortune:'大吉', cls:'f-da-ji', desc:'刚健中正，自强不息。运势极佳，宜积极主动，大有可为。' },

let luopanSpinning = false;

function drawLuopan() {
  const canvas = document.getElementById('luopanCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, cx = W/2, cy = H/2, R = 136;
  const COLORS = ['#c9952e15','#b91c1c15','#c9952e15','#b91c1c15','#c9952e15','#b91c1c15','#c9952e15','#b91c1c15'];

  for (let i = 0; i < 8; i++) {
    const a1 = -Math.PI/2 + i * Math.PI/4;
    const a2 = a1 + Math.PI/4;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a1, a2); ctx.closePath();
    ctx.fillStyle = COLORS[i]; ctx.fill();
    ctx.strokeStyle = '#1c130d'; ctx.lineWidth = 2; ctx.stroke();

    const mid = a1 + Math.PI/8;
    ctx.fillStyle = '#f0d68a'; ctx.font = '22px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(TRIGRAMS[i].symbol, cx + R*0.62*Math.cos(mid), cy + R*0.62*Math.sin(mid));
    ctx.fillStyle = '#8a7a6a'; ctx.font = '10px sans-serif';
    ctx.fillText(TRIGRAMS[i].name, cx + R*0.87*Math.cos(mid), cy + R*0.87*Math.sin(mid));
  }

  // Center yin-yang
  const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 18);
  grd.addColorStop(0, '#1c130d'); grd.addColorStop(1, '#0c0704');
  ctx.beginPath(); ctx.arc(cx, cy, 18, 0, Math.PI*2);
  ctx.fillStyle = grd; ctx.fill();
  ctx.strokeStyle = '#c9952e'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#c9952e'; ctx.font = '18px "Noto Serif SC",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('命', cx, cy+1);
}

function spinLuopan() {
  if (luopanSpinning) return;
  luopanSpinning = true;
  const wheel = document.getElementById('luopanWheel');
  const btn = document.getElementById('luopanBtn');
  const resultDiv = document.getElementById('luopanResult');
  if (!wheel || !btn) return;
  btn.disabled = true; resultDiv.innerHTML = '';

  const segIdx = Math.floor(Math.random() * 8);
  const spins = 5 + Math.floor(Math.random() * 3);
  const extraDeg = segIdx * 45 + 15 + Math.random() * 15;
  const totalDeg = spins * 360 + extraDeg;

  wheel.style.transition = 'transform 3.2s cubic-bezier(0.17,0.67,0.12,0.99)';
  wheel.style.transform = `rotate(${totalDeg}deg)`;

  playTone(392, 0.08, 'triangle', 0.06);
  setTimeout(() => playTone(440, 0.08, 'triangle', 0.06), 100);
  setTimeout(() => playTone(494, 0.08, 'triangle', 0.06), 200);

  setTimeout(() => {
    luopanSpinning = false;
    btn.disabled = false;
    const t = TRIGRAMS[segIdx];
    if (t.fortune === '大吉') burstParticles('#f0d68a', 35);
    playFanfare(t.cls.replace('f-',''));
    resultDiv.innerHTML = `<div class="luopan-result">
      <div class="lr-symbol">${t.symbol}</div>
      <div class="lr-name">${t.name} · ${t.meaning}</div>
      <div class="lr-fortune ${t.cls}">${t.fortune}</div>
      <div class="lr-desc">${t.desc}</div>
    </div>`;
  }, 3400);
}

// ===== 语音朗读命理 =====
function speakAnalysis() {
  const btn = document.getElementById('listenBtn');
  if (!btn) return;
  if (window.speechSynthesis.speaking) {
    window.speechSynthesis.cancel();
    btn.classList.remove('speaking'); btn.textContent = '🎧 聆听天命';
    return;
  }
  const titleEl = document.querySelector('.title-card h2');
  const cards = document.querySelectorAll('.analysis-card');
  let text = '';
  if (titleEl) text += titleEl.textContent + '。';
  cards.forEach(c => {
    const ps = c.querySelectorAll('p');
    ps.forEach(p => {
      const t = (p.textContent||'').replace(/\s+/g,'');
      if (t) text += t + '。';
    });
  });
  if (text.length < 5) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.9; u.pitch = 1.0;
  const voices = window.speechSynthesis.getVoices();
  const zh = voices.find(v => v.lang.startsWith('zh'));
  if (zh) u.voice = zh;
  u.onstart = () => { btn.classList.add('speaking'); btn.textContent = '⏹ 停止诵读'; };
  u.onend = () => { btn.classList.remove('speaking'); btn.textContent = '🎧 聆听天命'; };
  u.onerror = () => { btn.classList.remove('speaking'); btn.textContent = '🎧 聆听天命'; };
  window.speechSynthesis.speak(u);
}
