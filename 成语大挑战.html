<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>成语大挑战 · 成语积累训练</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f3ee;--bg2:#fafaf8;--card:#fff;--card2:#f8f7f4;--accent:#b8860b;--accent2:#daa520;--red:#c0392b;--red2:#e74c3c;--pink:#fceae8;--text:#2d2d2d;--sub:#9a9a9a;--success:#27ae60;--error:var(--red2);--radius:16px;--shadow:0 4px 24px rgba(0,0,0,.05)}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center}
#app{width:100%;max-width:420px;min-height:100vh;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--bg2)}
.bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-deco .orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.07}
.bg-deco .orb:nth-child(1){width:260px;height:260px;background:var(--red);top:-100px;right:-60px}
.bg-deco .orb:nth-child(2){width:200px;height:200px;background:var(--accent);bottom:-60px;left:-60px}
.bg-deco .orb:nth-child(3){width:160px;height:160px;background:var(--red2);top:45%;left:30%}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 4px;z-index:10;position:relative}
header .back-btn{background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer;padding:4px}
header .back-btn:active{transform:scale(.85)}.header-title{font-size:16px;font-weight:700;color:var(--accent)}.header-right{font-size:12px;color:var(--sub)}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all .12s;text-align:center}
.btn:active{transform:scale(.97)}.btn-red{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;box-shadow:0 4px 16px rgba(192,57,43,.25)}.btn-outline{background:transparent;border:2px solid #e0ddd5;color:var(--text)}
.home-screen{text-align:center;padding:30px 18px;flex:1;display:flex;flex-direction:column;justify-content:center;z-index:10}
.home-screen .logo{font-size:52px;margin-bottom:2px}.home-screen h1{font-size:34px;font-weight:900;color:var(--red);margin-bottom:2px}.home-screen .subtitle{color:var(--sub);font-size:13px;margin-bottom:6px}
.home-tagline{color:var(--accent2);font-size:13px;font-weight:600;margin-bottom:16px;letter-spacing:2px}
.home-feats{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;text-align:left}
.home-feats .feat{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--card);padding:10px 14px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.02);border:1px solid #f0ede8}
.map-screen{flex:1;display:flex;flex-direction:column;padding:10px 18px 20px;overflow-y:auto;z-index:10}
.map-screen h2{text-align:center;font-size:20px;font-weight:800;color:var(--red);margin-bottom:12px}
.map-path{flex:1;display:flex;flex-direction:column;gap:8px}
.map-node{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid #f0ede8;border-radius:12px;padding:12px 14px;cursor:pointer;transition:all .2s}
.map-node:active{transform:scale(.98)}.map-node.locked{opacity:.3;pointer-events:none}
.map-node.current{border-color:var(--red);box-shadow:0 0 16px rgba(192,57,43,.08)}.map-node.completed{border-color:rgba(39,174,96,.2)}
.map-node .icon{font-size:26px;min-width:34px;text-align:center}.map-node .info{flex:1;min-width:0}
.map-node .info .name{font-size:15px;font-weight:700}.map-node .info .desc{font-size:11px;color:var(--sub);margin-top:1px}
.map-node .status{font-size:12px;color:var(--accent)}.map-connector{text-align:center;font-size:9px;color:#d0d0d0;margin:-3px 0}
.map-progress{text-align:center;font-size:12px;color:var(--sub);margin-bottom:8px}.map-progress span{color:var(--red);font-weight:700}
.game-screen{flex:1;display:flex;flex-direction:column;padding:6px 16px 16px;z-index:10}
.game-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.game-hd .lvl-name{font-size:13px;color:var(--sub)}.game-hd .score{font-size:14px;font-weight:700;color:var(--red)}
.q-area{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px 0;text-align:center}
.q-area .q-hint{font-size:15px;color:var(--text);line-height:1.7;padding:0 4px;margin-bottom:12px;font-weight:500}
.q-area .q-hint em{font-style:normal;color:var(--red);font-weight:700}
.q-area .q-meta{font-size:12px;color:var(--sub);margin-bottom:8px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.choice-btn{background:var(--card);border:2px solid #e8e5e0;border-radius:12px;padding:16px 8px;font-size:17px;font-weight:600;cursor:pointer;transition:all .12s;text-align:center;color:var(--text)}
.choice-btn:active{transform:scale(.95);border-color:var(--accent)}.choice-btn.correct{background:#d4edda;border-color:var(--success);animation:fadeUp .25s}
.choice-btn.wrong{background:var(--pink);border-color:var(--error);animation:shake .35s}.choice-btn.disabled{pointer-events:none;opacity:.6}
.q-progress{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:0 2px}
.q-progress .info{font-size:11px;color:var(--sub);display:flex;gap:12px}.q-progress .info em{font-style:normal;color:var(--red);font-weight:700}
.q-progress .streak{font-size:13px;font-weight:700;color:#e67e22;opacity:0;transition:opacity .2s}.q-progress .streak.active{opacity:1}
.progress-dots{display:flex;gap:4px;justify-content:center;margin:4px 0 2px}
.progress-dots .dot{width:7px;height:7px;border-radius:50%;background:#e8e5e0;transition:all .2s}
.progress-dots .dot.done{background:var(--success)}.progress-dots .dot.wrong{background:var(--error)}.progress-dots .dot.current{background:var(--accent);transform:scale(1.3)}
.result-overlay{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);backdrop-filter:blur(6px);animation:fadeIn .3s ease}
.result-overlay.hidden{display:none}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.result-card{background:var(--card);border-radius:var(--radius);padding:28px 24px;width:90%;max-width:340px;text-align:center;box-shadow:0 12px 48px rgba(0,0,0,.08);border:1px solid #f0ede8;animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.result-card .big-icon{font-size:52px;margin-bottom:4px}.result-card .title{font-size:22px;font-weight:800;margin-bottom:2px}.result-card .sub{font-size:13px;color:var(--sub);margin-bottom:10px}
.result-card .stars{font-size:26px;margin-bottom:6px}.result-card .score-big{font-size:40px;font-weight:900;color:var(--red)}.result-card .score-lbl{font-size:11px;color:var(--sub);margin-bottom:10px}
.result-card .stats{display:flex;justify-content:center;gap:20px;margin-bottom:12px}.result-card .stats .item{text-align:center}.result-card .stats .item .v{font-size:18px;font-weight:700}.result-card .stats .item .l{font-size:10px;color:var(--sub)}
.result-combo{font-size:14px;font-weight:700;color:#e67e22;margin-bottom:8px;opacity:0;animation:comboPop .5s .3s forwards}
@keyframes comboPop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{translate:0}20%{translate:-6px}40%{translate:6px}60%{translate:-4px}80%{translate:4px}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.correct-flash{position:fixed;inset:0;pointer-events:none;z-index:30;display:flex;align-items:center;justify-content:center}
.correct-flash .lbl{font-size:46px;font-weight:900;color:var(--success);opacity:0;animation:cfx .5s ease forwards}
@keyframes cfx{0%{transform:scale(.5);opacity:0}50%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:0}}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="bg-deco"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
<div id="app">
<header id="gameHeader" class="hidden"><button class="back-btn" id="headerBack">‹</button><span class="header-title" id="headerTitle">成语大挑战</span><span class="header-right" id="headerRight"></span></header>
<div class="game-area" id="gameArea">
  <div id="homeScreen" class="home-screen">
    <span class="logo">🀄</span><h1>成语大挑战</h1><div class="subtitle">成语积累训练</div>
    <div class="home-tagline">─ 博古通今 出口成章 ─</div>

    <div class="game-hd"><span class="lvl-name" id="lvlName">数字成语</span><span class="score">⭐ <span id="gameScore">0</span></span></div>

      <div class="streak" id="streakDisplay">🔥 <span id="streakCount">0</span></div>
    </div>
  </div>
  <div id="resultOverlay" class="result-overlay hidden">
    <div class="result-card">
      <div class="big-icon" id="resultIcon">🎉</div><div class="title" id="resultTitle">闯关成功！</div><div class="sub" id="resultSub">太棒了</div>
      <div class="stars" id="resultStars">⭐⭐⭐</div><div class="score-big" id="resultScore">0</div><div class="score-lbl">得分</div>
      <div class="stats"><div class="item"><div class="v" id="rC">0</div><div class="l">正确</div></div><div class="item"><div class="v" id="rW">0</div><div class="l">错误</div></div><div class="item"><div class="v" id="rS">0</div><div class="l">最大连击</div></div></div>
      <div class="result-combo" id="resultCombo"></div>
      <button class="btn btn-red" id="resultBtn">下一关</button>
      <button class="btn btn-outline" id="resultHomeBtn" style="margin-top:6px;font-size:13px">返回</button>
    </div>
  </div>
</div></div>
<script>
const SAVE_KEY='chengyu_save';const QS=8;const PASS=6;
const DATA=[
  // 0-数字成语
  {d:"形容非常容易，不费力气",a:"轻而易举",l:0},{d:"形容注意力非常集中",a:"聚精会神",l:0},{d:"形容高兴到了极点",a:"欣喜若狂",l:0},{d:"形容声音很大",a:"震耳欲聋",l:0},{d:"形容非常着急",a:"心急如焚",l:0},{d:"形容非常勤勉",a:"孜孜不倦",l:0},{d:"形容舍不得离开",a:"恋恋不舍",l:0},{d:"形容非常感动",a:"感激涕零",l:0},{d:"形容极其愤怒",a:"怒发冲冠",l:0},{d:"形容非常害怕",a:"胆战心惊",l:0},{d:"形容非常吃惊",a:"目瞪口呆",l:0},{d:"形容非常悲痛",a:"痛不欲生",l:0},
  // 1-动物成语
  {d:"比喻登上高位或有了较高的成就",a:"出人头地",l:1},{d:"比喻主动承认错误",a:"负荆请罪",l:1},{d:"比喻没有本领的人混在行家里面充数",a:"滥竽充数",l:1},{d:"比喻不必要的忧虑",a:"杞人忧天",l:1},{d:"比喻举动非常谨慎",a:"小心翼翼",l:1},{d:"比喻东西突然丢失",a:"不翼而飞",l:1},{d:"比喻没有消息",a:"杳无音信",l:1},{d:"比喻自命不凡",a:"自以为是",l:1},{d:"比喻事情很容易做",a:"易如反掌",l:1},{d:"比喻目光短浅",a:"鼠目寸光",l:1},{d:"比喻说话做事坚决果断",a:"斩钉截铁",l:1},{d:"比喻白费力气",a:"徒劳无功",l:1},
  // 2-自然成语
  {d:"形容声音非常大",a:"惊天动地",l:2},{d:"形容变化很多",a:"千变万化",l:2},{d:"形容数量非常多",a:"不计其数",l:2},{d:"形容非常稀少",a:"寥寥无几",l:2},{d:"形容景象非常繁荣",a:"欣欣向荣",l:2},{d:"形容接连不断",a:"连绵不断",l:2},{d:"形容来势很猛",a:"铺天盖地",l:2},{d:"形容范围非常广",a:"一望无际",l:2},{d:"形容非常壮观",a:"气势磅礴",l:2},{d:"形容十分危险",a:"千钧一发",l:2},{d:"形容时间极短",a:"转瞬即逝",l:2},{d:"形容非常遥远",a:"天涯海角",l:2},
  // 3-人物成语
  {d:"形容人品德高尚",a:"德高望重",l:3},{d:"形容人非常有才华",a:"才华横溢",l:3},{d:"形容人非常聪明",a:"聪明伶俐",l:3},{d:"形容人非常勇敢",a:"勇敢无畏",l:3},{d:"形容人非常正直",a:"刚正不阿",l:3},{d:"形容人非常有智慧",a:"足智多谋",l:3},{d:"形容人很勤奋",a:"勤奋好学",l:3},{d:"形容人很谦虚",a:"谦虚谨慎",l:3},{d:"形容人很有志向",a:"志存高远",l:3},{d:"形容人坚持不懈",a:"持之以恒",l:3},{d:"形容人非常努力",a:"废寝忘食",l:3},{d:"形容人阅历丰富",a:"见多识广",l:3},
  // 4-寓言成语
  {d:"自己欺骗自己",a:"掩耳盗铃",l:4},{d:"不切实际地追求过高目标",a:"好高骛远",l:4},{d:"做多余的、不必要的事",a:"画蛇添足",l:4},{d:"不根据实际情况办事",a:"刻舟求剑",l:4},{d:"多此一举，反而坏事",a:"画龙点睛",l:4},{d:"比喻不懂事物已变化",a:"守株待兔",l:4},{d:"为寻回失物而枉费工夫",a:"亡羊补牢",l:4},{d:"强求一致，不知变通",a:"郑人买履",l:4},{d:"目光短浅，自以为是",a:"井底之蛙",l:4},{d:"做多余的事",a:"画蛇添足",l:4},{d:"借别人的力量来欺压人",a:"狐假虎威",l:4},{d:"争着向前唯恐落后",a:"争先恐后",l:4},
  // 5-历史成语
  {d:"比喻知音难觅或乐曲高妙",a:"高山流水",l:5},{d:"比喻非常危险的地方",a:"四面楚歌",l:5},{d:"比喻有志气的人勤学苦练",a:"卧薪尝胆",l:5},{d:"比喻登上高位就有了依靠",a:"一鸣惊人",l:5},{d:"把原物完好地归还本人",a:"完璧归赵",l:5},{d:"形容兵马很多",a:"千军万马",l:5},{d:"比喻遇到危险就退缩",a:"知难而退",l:5},{d:"比喻用计脱逃",a:"金蝉脱壳",l:5},{d:"比喻走投无路时不顾一切",a:"破釜沉舟",l:5},{d:"形容军纪严明",a:"秋毫无犯",l:5},{d:"比喻彻底失败",a:"一败涂地",l:5},{d:"比喻做事有恒心",a:"铁杵成针",l:5},
  // 6-描写成语
  {d:"形容春天的景色",a:"春暖花开",l:6},{d:"形容夏天的炎热",a:"烈日炎炎",l:6},{d:"形容秋天的景象",a:"秋高气爽",l:6},{d:"形容冬天的景象",a:"冰天雪地",l:6},{d:"形容风景非常优美",a:"山清水秀",l:6},{d:"形容非常美丽的景色",a:"鸟语花香",l:6},{d:"形容心情非常愉快",a:"心花怒放",l:6},{d:"形容非常悲伤",a:"泪流满面",l:6},{d:"形容非常兴奋",a:"兴高采烈",l:6},{d:"形容非常专心",a:"全神贯注",l:6},{d:"形容非常疲劳",a:"筋疲力尽",l:6},{d:"形容非常饥饿",a:"饥肠辘辘",l:6},
  // 7-综合
  {d:"形容变化非常多",a:"变化多端",l:7},{d:"形容色彩繁多",a:"五彩缤纷",l:7},{d:"形容非常珍贵",a:"无价之宝",l:7},{d:"形容非常紧急",a:"迫在眉睫",l:7},{d:"形容快速前进",a:"勇往直前",l:7},{d:"形容非常团结",a:"众志成城",l:7},{d:"形容非常默契",a:"心照不宣",l:7},{d:"形容做事有条理",a:"井井有条",l:7},{d:"形容毫无秩序",a:"乱七八糟",l:7},{d:"形容非常高兴",a:"欢天喜地",l:7},{d:"形容非常感动",a:"热泪盈眶",l:7},{d:"形容非常热爱",a:"情有独钟",l:7},
];
const LEVELS=[{n:'基础成语',d:'常用成语'},{n:'进阶成语',d:'常见成语'},{n:'自然万象',d:'自然类成语'},{n:'人物品格',d:'人物类成语'},{n:'寓言故事',d:'寓言类成语'},{n:'历史典故',d:'历史类成语'},{n:'描写类',d:'写景抒情成语'},{n:'综合挑战',d:'随机出题'}];
let S=load()||{completed:{},stars:{},scores:{},points:0};let G={},timer=null;const $=id=>document.getElementById(id);
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function getPool(lvl){return DATA.filter(d=>d.l===lvl);}
function genLevelQs(lvl){const pool=getPool(lvl);const shuffled=shuffle([...pool]);const qs=[];for(let i=0;i<QS&&i<shuffled.length;i++){const w=shuffled[i];const others=pool.filter(x=>x.a!==w.a);const wrongs=shuffle([...others]).slice(0,3).map(x=>x.a);const opts=shuffle([w.a,...wrongs]);qs.push({hint:w.d,answer:w.a,opts,idx:opts.indexOf(w.a)});}return qs;}
function startLevel(i){stopTimer();G={idx:i,qi:0,cor:0,wro:0,str:0,mxStr:0,pts:0,res:[],qs:[],as:false};G.qs=genLevelQs(i);showGame();showQ();}
function showQ(){const q=G.qs[G.qi];G.as=false;stopTimer();const lv=LEVELS[G.idx];$('lvlName').textContent=lv.n;$('gameScore').textContent=G.pts;$('qHint').textContent=q.hint;$('qMeta').textContent=`第 ${G.qi+1} / ${QS} 题`;$('correctCount').textContent=G.cor;$('streakCount').textContent=G.str;$('streakDisplay').className='streak'+(G.str>=2?' active':'');dots();const c=$('choicesContainer');c.innerHTML='';q.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='choice-btn';b.textContent=o;b.addEventListener('click',()=>chk(i));c.appendChild(b);});startTimer(12);}
function chk(idx){if(G.as)return;G.as=true;stopTimer();const q=G.qs[G.qi];const btns=$('choicesContainer').querySelectorAll('.choice-btn');const ok=idx===q.idx;btns.forEach((b,i)=>{b.classList.add('disabled');if(i===q.idx)b.classList.add('correct');if(i===idx&&!ok)b.classList.add('wrong');});if(ok){const bonus=Math.max(0,Math.floor(G.tm/12*15));const sb=Math.min(G.str,8)*3;G.pts+=10+bonus+sb;G.cor++;G.str++;G.mxStr=Math.max(G.mxStr,G.str);G.res.push(true);sfxOk();const el=document.createElement('div');el.className='correct-flash';el.innerHTML=`<div class="lbl">+${10+bonus+sb}</div>`;document.body.appendChild(el);setTimeout(()=>el.remove(),600);}else{G.wro++;G.str=0;G.res.push(false);sfxBad();}dots();$('correctCount').textContent=G.cor;$('streakCount').textContent=G.str;$('streakDisplay').className='streak'+(G.str>=2?' active':'');$('gameScore').textContent=G.pts;setTimeout(()=>{G.qi++;if(G.qi>=QS)return endLv();showQ();},ok?500:1000);}
function endLv(){stopTimer();const passed=G.cor>=PASS;let st=0;if(passed){st=G.cor===QS?3:G.cor>=QS-1?2:1}const lid=LEVELS[G.idx].n;if(st>(S.stars[lid]||0))S.stars[lid]=st;if(G.pts>(S.scores[lid]||0))S.scores[lid]=G.pts;if(passed)S.completed[lid]=true;S.points+=G.pts;save();$('resultIcon').textContent=passed?'🎉':'💪';$('resultTitle').textContent=passed?'闯关成功！':'继续加油！';$('resultSub').textContent=passed?['勉强过关','不错哦！','完美通关！'][st-1]:`答对 ${G.cor}/${QS}`;$('resultStars').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);$('resultScore').textContent=G.pts;$('rC').textContent=G.cor;$('rW').textContent=G.wro;$('rS').textContent=G.mxStr;$('resultCombo').textContent=G.mxStr>=3?`🔥 最高连击 ${G.mxStr}x`:'';if(G.idx+1>=LEVELS.length){$('resultBtn').textContent='🏆 全部通关！';$('resultBtn').onclick=()=>{hideR();showMap();};}else if(passed){$('resultBtn').textContent='下一关 →';$('resultBtn').onclick=()=>{hideR();startLevel(G.idx+1);};}else{$('resultBtn').textContent='🔄 重新挑战';$('resultBtn').onclick=()=>{hideR();startLevel(G.idx);};}$('resultHomeBtn').onclick=()=>{hideR();showMap();};$('resultOverlay').classList.remove('hidden');if(passed)sfxPass();else sfxDrop();}
function hideR(){$('resultOverlay').classList.add('hidden')}function startTimer(s){G.tm=s;stopTimer();updateTm(s);timer=setInterval(()=>{G.tm--;updateTm(G.tm);if(G.tm<=0&&!G.as){stopTimer();G.as=true;chk(-1);}},1000)}function stopTimer(){if(timer){clearInterval(timer);timer=null}}function updateTm(v){$('timerValue').textContent=String(Math.max(0,v))}
function dots(){const e=$('progressDots');e.innerHTML='';for(let i=0;i<QS;i++){const d=document.createElement('div');d.className='dot';if(i<G.res.length)d.classList.add(G.res[i]?'done':'wrong');if(i===G.qi)d.classList.add('current');e.appendChild(d)}}
function showMap(){hideAll();$('gameHeader').classList.remove('hidden');$('mapScreen').classList.remove('hidden');const p=$('mapPath');p.innerHTML='';let done=0;Object.keys(S.completed).forEach(k=>done++);$('mapProg').textContent=done;$('mapTotal').textContent=LEVELS.length;LEVELS.forEach((lv,i)=>{if(i>0){const c=document.createElement('div');c.className='map-connector';c.textContent='▼';p.appendChild(c)}const n=document.createElement('div');const comp=S.completed[lv.n];const cur=i===0||S.completed[LEVELS[i-1].n];n.className='map-node'+(cur?' current':'')+(comp?' completed':'')+(!cur&&!comp?' locked':'');n.innerHTML=`<div class="icon">${!cur&&!comp?'🔒':comp?'✅':'🀄'}</div><div class="info"><div class="name">${lv.n}</div><div class="desc">${lv.d}</div></div><div class="status">${'⭐'.repeat(S.stars[lv.n]||0)}</div>`;if((!comp&&cur)||comp)n.addEventListener('click',()=>startLevel(i));p.appendChild(n);});$('headerTitle').textContent='成语大挑战';$('headerRight').textContent=`⭐ ${S.points}`;$('headerBack').onclick=showHome;}
function showGame(){hideAll();$('gameHeader').classList.remove('hidden');$('gameScreen').classList.remove('hidden');$('headerBack').onclick=()=>{stopTimer();showMap()};}function showHome(){hideAll();$('homeScreen').classList.remove('hidden')}function hideAll(){['homeScreen','mapScreen','gameScreen'].forEach(id=>$(id).classList.add('hidden'));$('gameHeader').classList.add('hidden')}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}function load(){try{const r=localStorage.getItem(SAVE_KEY);if(!r)return null;const s=JSON.parse(r);if(typeof s.stars!=='object')s.stars={};if(typeof s.scores!=='object')s.scores={};if(typeof s.completed!=='object')s.completed={};return s}catch(e){return null}}
let ac=null;function tone(f,d,t='sine'){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=0.05;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function sfxOk(){tone(880,.1);setTimeout(()=>tone(1100,.12),70)}function sfxBad(){tone(300,.15,'sawtooth')}function sfxPass(){tone(660,.08);setTimeout(()=>tone(880,.08),80);setTimeout(()=>tone(1100,.15),160)}function sfxDrop(){tone(400,.1);setTimeout(()=>tone(300,.2),100)}
$('startBtn').addEventListener('click',showMap);$('resultHomeBtn').addEventListener('click',()=>{hideR();showMap()});showHome();
</script>
</body>
</html>
